name: Update live README sections

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest test_update_readme
        working-directory: .github/scripts

      - name: Update README
        run: python update_readme.py
        working-directory: .github/scripts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: classic PAT with `repo` scope, for the repo-traffic
          # section. The default GITHUB_TOKEN above can't read other repos'
          # traffic. Unset until added — the script falls back gracefully.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update live README sections [skip ci]"
          git push
